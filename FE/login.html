<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NusaBag Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NusaBag Studio</a>
      <a class="btn btn-outline-light btn-sm" href="index.html">Kembali ke Beranda</a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card border-0 shadow-sm p-4">
            <h3 class="fw-bold mb-1">Login</h3>
            <p class="text-muted small mb-3">Akun uji coba: <code>admin@nusabag.id</code> / <code>nusabag123</code></p>
            <div id="loginAlert"></div>
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="nama@email.com">
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="Masukkan password">
              </div>
              <button type="submit" class="btn btn-dark w-100">Masuk</button>
            </form>
            <p class="text-center text-muted small mt-3 mb-0">
              Belum punya akun? <a href="register.html">Daftar di sini</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <small>@copyright by 25552012010_SHERRYL AZIZAH AULIA</small>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
