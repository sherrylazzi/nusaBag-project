<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi - NusaBag Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NusaBag Studio</a>
      <a class="btn btn-outline-light btn-sm" href="index.html">Kembali ke Beranda</a>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card border-0 shadow-sm p-4">
            <h3 class="fw-bold mb-1">Registrasi Akun</h3>
            <p class="text-muted small mb-3">Buat akun baru untuk mengakses menu utama.</p>
            <div id="regAlert"></div>
            <form id="registerForm">
              <div class="mb-3">
                <label for="regNama" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="regNama" placeholder="Nama lengkap">
              </div>
              <div class="mb-3">
                <label for="regEmail" class="form-label">Email</label>
                <input type="email" class="form-control" id="regEmail" placeholder="nama@email.com">
              </div>
              <div class="mb-3">
                <label for="regPassword" class="form-label">Password</label>
                <input type="password" class="form-control" id="regPassword" placeholder="Minimal 6 karakter">
              </div>
              <button type="submit" class="btn btn-warning text-dark fw-semibold w-100">Daftar</button>
            </form>
            <p class="text-center text-muted small mt-3 mb-0">
              Sudah punya akun? <a href="login.html">Login di sini</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      <small>@copyright by 25552012010_SHERRYL AZIZAH AULIA</small>
    </div>
  </footer>

  <script src="js/auth.js"></script>
</body>
</html>
